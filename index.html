<script type="module">
/* =========================================================
   Due Date: a family baby pool.
   1. Everyone opens the link and adds their name(s). One phone can add several.
   2. Whoever adds the name "Aimee" first gets the organiser buttons.
   3. Aimee locks the names: she picks first, everyone else is shuffled at random.
   4. Each person picks one free date in turn. Aimee can skip slow pickers
      (they can still grab a free date later).
   5. Aimee enters the real birth date and the closest guess wins.
   Everything is shared live through Chop the Check's Realtime Database, under dueDate/.
   On localhost, ?mock uses a pretend database in this browser (add &phone=b for a second "phone").
   ========================================================= */
const POOL = 'dueDate';
const AIMEE = 'aimee';
const RANGE = 21; // days either side of the due date
const qs = new URLSearchParams(location.search);
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const MOCK = LOCAL && qs.has('mock');

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const PHONE = (MOCK && qs.get('phone')) || store.get('dd-phone') || (() => { const p = newId(); store.set('dd-phone', p); return p; })();
const cleanName = s => { // tidy spaces; "granny rose" becomes "Granny Rose"
  s = String(s || '').replace(/\s+/g, ' ').trim().slice(0, 24);
  return s === s.toLowerCase() ? s.replace(/(^|\s)\S/g, c => c.toUpperCase()) : s;
};
const isAimeeName = n => cleanName(n).toLowerCase() === AIMEE;
const list = o => !o ? [] : Array.isArray(o) ? o.filter(Boolean) : Object.keys(o).sort((a, b) => a - b).map(k => o[k]);
// dates are kept as 'YYYY-MM-DD' and worked out in UTC so clocks and time zones can't shift them
const toDay = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromDay = t => new Date(t).toISOString().slice(0, 10);
const DAY = 86400000;
const nice = (s, long) => new Date(toDay(s)).toLocaleDateString('en-IE', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: long ? 'long' : 'short', year: long ? 'numeric' : undefined });
const colour = i => 'c' + (i % 6);
function shuffle(a) { // fair shuffle using the phone's secure random numbers
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const r = new Uint32Array(1); crypto.getRandomValues(r); const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- the shared database ----------
   listen(cb): called with the whole pool every time anything changes
   update(patch): several changes at once, e.g. { 'people/abc': {...}, 'skipped/abc': true }, null deletes
   claim(path, value): only works if nobody has it yet (dates, the Aimee name); returns true/false */
async function firebaseDB() {
  const FB = 'https://www.gstatic.com/firebasejs/12.19.0/';
  const CONFIG = {
    apiKey: 'AIzaSyCFKyTr_-0QC7Vl-HjUpfMibi5Eu4IgKz0',
    authDomain: 'chopthecheck.firebaseapp.com',
    databaseURL: 'https://chopthecheck-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'chopthecheck',
    appId: '1:506847790153:web:109788afc2ad8afc31eb98'
  };
  const [appM, dbM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-database.js')]);
  const app = appM.initializeApp(CONFIG, 'due-date');
  if (/thespectrumtechengine\.com$/.test(location.hostname)) {
    try { const ac = await import(FB + 'firebase-app-check.js'); ac.initializeAppCheck(app, { provider: new ac.ReCaptchaEnterpriseProvider('6LeJiNAtAAAAAHozjgInBddSFOPOPBOMRsPwQ6qH'), isTokenAutoRefreshEnabled: true }); } catch {}
  }
  const db = dbM.getDatabase(app), root = dbM.ref(db, POOL);
  // "No signal" only if still not connected after a few seconds (Firebase says "not yet" first on every start)
  let online = false, offT = 0;
  dbM.onValue(dbM.ref(db, '.info/connected'), s => {
    online = !!s.val(); clearTimeout(offT);
    if (online) $('#offline').classList.add('hidden');
    else offT = setTimeout(() => { if (!online) $('#offline').classList.remove('hidden'); }, 4000);
  });
  return {
    listen: cb => dbM.onValue(root, s => cb(s.val() || {}), e => { console.warn(e); showError(); }),
    update: patch => dbM.update(root, patch),
    claim: async (path, value) => (await dbM.runTransaction(dbM.ref(db, POOL + '/' + path), cur => cur === null ? value : undefined, { applyLocally: false })).committed
  };
}
function mockDB() { // pretend database for testing on this computer, shared between tabs
  const K = 'dd-mock', ch = new BroadcastChannel(K), subs = [];
  const read = () => { try { return JSON.parse(store.get(K)) || {}; } catch { return {}; } };
  const tell = () => { const v = read(); subs.forEach(cb => cb(structuredClone(v))); };
  ch.onmessage = tell;
  const set = (obj, path, val) => {
    const ks = path.split('/'); let o = obj;
    ks.slice(0, -1).forEach(k => { o = o[k] = (o[k] && typeof o[k] === 'object') ? o[k] : {}; });
    if (val === null) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
  };
  const write = v => { store.set(K, JSON.stringify(v)); ch.postMessage(1); setTimeout(tell); };
  return {
    listen: cb => { subs.push(cb); setTimeout(tell); },
    update: async patch => { const v = read(); Object.entries(patch).forEach(([p, val]) => set(v, p, val)); write(v); },
    claim: async (path, value) => { const v = read(); if (path.split('/').reduce((o, k) => o && o[k], v) != null) return false; set(v, path, value); write(v); return true; }
  };
}

/* ---------- state ---------- */
let S = {}, DB = null, started = false, busy = false, lastDates = {};
const people = () => S.people || {};
const nameOf = id => (people()[id] || {}).name || '?';
const amAimee = () => !!(S.aimee && S.aimee.phone === PHONE && people()[S.aimee.pid]);
const myIds = () => Object.keys(people()).filter(id => people()[id].phone === PHONE);
const order = () => list(S.order).filter(id => people()[id]);
const pickOf = () => { const p = {}; Object.entries(S.dates || {}).forEach(([d, id]) => { if (people()[id]) p[id] = d; }); return p; };
const skipped = id => !!(S.skipped && S.skipped[id]);
const turnNow = () => { const p = pickOf(); return order().find(id => !p[id] && !skipped(id) && !forfeit(id)); };

/* ---------- paying, the deadline and forfeits ----------
   Everyone except Aimee pays the amount per name into Aimee's Revolut; Aimee (or the host, in the owner tools) ticks
   them off in the owner tools (paid/<id>). Deadline: the end of the day before the earliest
   picked date, Irish time. After that, unpaid names lose their date, and those dates are
   "up for grabs": people enter (grabs/<day>/<id>), Aimee or the host draws a winner
   (grabbed/<day> = { pid, paid }), and the winner pays the amount again straight away. */
const REVOLUT = 'https://revolut.me/aimeekate_s';
const isAimeeId = id => !!(S.aimee && S.aimee.pid === id);
const isPaid = id => isAimeeId(id) || !!(S.paid && S.paid[id]);
const todayIE = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Dublin' }).format(new Date());
const earliest = () => Object.keys(S.dates || {}).filter(d => people()[S.dates[d]]).sort()[0] || null;
const payBy = () => { const e = earliest(); return e ? fromDay(toDay(e) - DAY) : null; }; // the last day to pay
const pastDeadline = () => { const e = earliest(); return !!e && todayIE() >= e; };
function forfeit(id) { return !!S.locked && !isPaid(id) && pastDeadline(); }
const grabbedBy = d => { const g = S.grabbed && S.grabbed[d]; return g && people()[g.pid] ? g.pid : null; };
const holderOf = d => { const g = grabbedBy(d); if (g) return g; const id = S.dates && S.dates[d]; return id && people()[id] && !forfeit(id) ? id : null; };
const upForGrabs = d => { const id = S.dates && S.dates[d]; return !!id && !!people()[id] && forfeit(id) && !grabbedBy(d); };
const grabDays = () => Object.keys(S.dates || {}).filter(upForGrabs).sort();
const wonDays = () => Object.keys(S.grabbed || {}).filter(grabbedBy).sort();
const entriesFor = d => Object.keys((S.grabs && S.grabs[d]) || {}).filter(id => people()[id] && !forfeit(id));
const amt = () => S.amount ? euro(S.amount) : 'the entry money';
const badge = id => isAimeeId(id) ? '<span class="pb free">👑 free</span>' : forfeit(id) ? '<span class="pb lost">❌ forfeit</span>'
  : isPaid(id) ? '<span class="pb ok">✓ paid</span>' : '<span class="pb due">⏳ not paid</span>';
const colourOf = id => colour(Math.max(0, order().indexOf(id) >= 0 ? order().indexOf(id) : Object.keys(people()).sort((a, b) => people()[a].at - people()[b].at).indexOf(id)));
// who this phone may pick for right now: its own names on their turn or skipped; Aimee also for the current/skipped person
function canPickFor() {
  if (!S.locked || S.birth) return [];
  const p = pickOf(), now = turnNow(), mine = new Set(myIds()), aim = amAimee();
  return order().filter(id => !p[id] && !forfeit(id) && (id === now || skipped(id)) && (mine.has(id) || aim))
    .sort((a, b) => (mine.has(b) - mine.has(a)) || ((b === now) - (a === now)));
}
function showError() { $('#app').innerHTML = `<div class="card err"><h2>Hmm, the pool won't load 😕</h2><p>Check the internet connection, then refresh the page.</p></div>`; }

/* ---------- drawing the page ---------- */
function render() {
  const app = $('#app');
  const focused = document.activeElement && document.activeElement.id, typed = $('#name') ? $('#name').value : '';
  let h = '';
  if (S.birth) h += winnerCard();
  else if (!S.locked) h += joinCards();

}
// the jackpot: Aimee's amount for every date picked so far

const paying = () => Object.keys(people()).filter(id => !(S.aimee && S.aimee.pid === id)).length; // Aimee plays free

function pickCards() {
  const ord = order(), p = pickOf(), now = turnNow(), mine = new Set(myIds()), can = canPickFor();
  let banner;
  if (!now && ord.every(id => p[id] || forfeit(id))) banner = `<div class="banner">All the dates are picked! 🎉<br><span class="muted">Now we wait for baby 🍼</span></div>`;

  else if (mine.has(now)) banner = `<div class="banner mine">🎉 It's your turn${mine.size > 1 ? ' for <b>' + esc(nameOf(now)) + '</b>' : ', <b>' + esc(nameOf(now)) + '</b>'}!<br><span class="muted">Tap a free date below 👇</span></div>`;

        <span class="st">${forfeit(id) ? (p[id] ? `<s>${nice(p[id])}</s>` : '—') : p[id] ? '📅 ' + nice(p[id]) : id === now ? 'picking now…' : skipped(id) ? '⏭️ skipped' : 'waiting'}</span></li>`).join('')}</ol>

}

function calendar(canPick) {
  if (!S.due) return '<p class="muted">Aimee hasn\'t set the due date yet.</p>';
  const start = toDay(S.due) - RANGE * DAY, end = toDay(S.due) + RANGE * DAY;
  const taken = S.dates || {}, mine = new Set(myIds());
  let h = '<div class="cal">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="wd">${d}</div>`).join('');
  const lead = (new Date(start).getUTCDay() + 6) % 7;
  for (let i = 0; i < lead; i++) h += '<div class="d blank"></div>';
  for (let t = start; t <= end; t += DAY) {
    const d = fromDay(t), dt = new Date(t), who = holderOf(d), grab = upForGrabs(d), used = !!people()[taken[d]];
    const first = t === start || dt.getUTCDate() === 1;
    const cls = ['d', who ? 'taken' : grab ? 'grab' : used ? 'taken' : 'free', who && mine.has(who) ? 'mine-pick' : '', !used && canPick ? 'can' : '',
      grab && !S.birth ? 'enter' : '', d === S.due ? 'duedate' : '', d === S.birth ? 'born' : '', lastDates.pop === d ? 'pop' : ''].join(' ');
    h += `<button class="${cls}" data-day="${d}" ${(used && !grab) || (!used && !canPick) ? 'tabindex="-1"' : ''} aria-label="${nice(d, true)}${who ? ', taken by ' + esc(nameOf(who)) : grab ? ', up for grabs' : ''}">
      <span class="m">${first ? dt.toLocaleDateString('en-IE', { timeZone: 'UTC', month: 'short' }) : '&nbsp;'}</span>${dt.getUTCDate()}
      ${who ? `<span class="t ${colourOf(who)}">${esc(nameOf(who))}</span>` : grab ? '<span class="t c2">🎟️ grab</span>' : ''}</button>`;
  }
  return h + '</div>';
}

/* ---------- buttons ---------- */
function wire() {
  const f = $('#join');
  if (f) f.onsubmit = e => { e.preventDefault(); join(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removePerson(b.dataset.del));
  document.querySelectorAll('.cal .d.can').forEach(b => b.onclick = () => pick(b.dataset.day));
  document.querySelectorAll('.cal .d.enter').forEach(b => b.onclick = () => enterGrab(b.dataset.day));
  document.querySelectorAll('[data-grabdraw]').forEach(b => b.onclick = () => grabDraw(b.dataset.grabdraw));
  document.querySelectorAll('[data-tick]').forEach(c => c.onchange = () => act(() => DB.update({ ['paid/' + c.dataset.tick]: c.checked || null })));
  document.querySelectorAll('[data-gtick]').forEach(c => c.onchange = () => act(() => DB.update({ ['grabbed/' + c.dataset.gtick + '/paid']: c.checked })));
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('saveAmount', () => { const v = Math.round(+$('#amount').value * 100) / 100; if (v > 0 && v <= 1000) act(() => DB.update({ amount: v })); });
  on('saveDue',() => { const v = $('#due').value; if (v) act(() => DB.update({ due: v })); });
  on('lock', lockAndDraw);
  on('skip', () => { const id = turnNow(); if (id) act(() => DB.update({ ['skipped/' + id]: true })); });
  on('saveBorn', () => { const v = $('#born').value; if (!v) return; ask(`Baby born on <b>${nice(v, true)}</b>?`, 'Yes, show the winner! 🎉', () => act(() => DB.update({ birth: v }))); });
  on('undoBorn', () => act(() => DB.update({ birth: null })));
  on('replay', () => playDraw(true));
}
async function act(fn) { if (busy) return; busy = true; try { await fn(); } catch (e) { console.warn(e); toast("That didn't save. Check the internet and try again."); } finally { busy = false; } }
function toast(msg) { const m = $('#joinMsg'); if (m) { m.innerHTML = `<p class="note">${msg}</p>`; } else alert(msg.replace(/<[^>]+>/g, '')); }

async function join() {
  const name = cleanName($('#name').value);
  if (!name) return;
  if (S.locked) return toast('Sorry, the names are locked now.');
  if (Object.values(people()).some(p => p.name.toLowerCase() === name.toLowerCase()))
    return toast(isAimeeName(name) ? 'Aimee is already in! 👑 Use a different name, like Aimee B.' : `Someone called <b>${esc(name)}</b> is already in. Add an initial, like ${esc(name)} B.`);
  const id = newId();
  await act(async () => {
    if (isAimeeName(name) && !(await DB.claim('aimee', { pid: id, phone: PHONE }))) {
      // the Aimee spot is still held by a name that's been removed: take it over
      if (S.aimee && !people()[S.aimee.pid]) await DB.update({ aimee: { pid: id, phone: PHONE } });
      else return toast('Aimee is already in! 👑 Use a different name, like Aimee B.');
    }
    await DB.update({ ['people/' + id]: { name, phone: PHONE, at: Date.now() } });
    $('#name').value = '';
    confetti(40);
  });
}
function removePerson(id) {
  const p = people()[id]; if (!p) return;
  ask(`Remove <b>${esc(p.name)}</b> from the pool?`, 'Remove', () => act(() => DB.update({ ['people/' + id]: null, ...(S.aimee && S.aimee.pid === id ? { aimee: null } : {}) })));
}
function lockAndDraw() {
  ask('Lock the names and do the draw? 🎲<br><span class="muted">Nobody can join after this.</span>', '🔒 Lock & draw!', () => act(async () => {
    const others = shuffle(Object.keys(people()).filter(id => id !== S.aimee.pid));
    const ord = {}; [S.aimee.pid, ...others].forEach((id, i) => { ord[i] = id; });
    await DB.update({ locked: true, order: ord });
  }));
}
function pick(day) {
  const can = canPickFor(); if (!can.length) return;
  const who = ($('#pickFor') && $('#pickFor').value) || can[0];
  ask(`Pick <b>${nice(day, true)}</b> for <b>${esc(nameOf(who))}</b>?<br><span class="muted">This can't be changed.</span>`, 'Yes, that one! 🍼', () => act(async () => {
    if (pickOf()[who]) return;
    lastDates.pop = day;
    if (!(await DB.claim('dates/' + day, who))) { lastDates.pop = null; return alert('Oops! Someone just grabbed that date. Pick another one.'); }
    confetti(70);
  }));
}
// enter (or leave) the draw for an up-for-grabs date, for any of this phone's names
function enterGrab(day) {
  const mine = myIds().filter(id => !forfeit(id) && holderOf(day) !== id);
  if (!mine.length) return alert(myIds().length ? 'Your names can\'t enter this draw (only paid names can).' : 'Only people in the pool can enter the draw.');
  const inn = new Set(entriesFor(day));
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h2>🎟️ ${nice(day, true)}</h2>
    <p>This date is up for grabs! Tick who wants to enter the draw.</p>
    <div class="ticks">${mine.map(id => `<label><input type="checkbox" value="${id}" ${inn.has(id) ? 'checked' : ''}> ${esc(nameOf(id))}</label>`).join('')}</div>
    <p class="note">If you win, pay ${amt()} with Revolut straight away to keep it.</p>
    <div class="btns"><button class="ghost" data-no>Cancel</button><button data-yes>Save 🎟️</button></div></div>`;
  document.body.append(ov);
  ov.querySelector('[data-no]').onclick = () => ov.remove();
  ov.querySelector('[data-yes]').onclick = () => {
    const patch = {}; ov.querySelectorAll('input').forEach(c => { if (c.checked !== inn.has(c.value)) patch['grabs/' + day + '/' + c.value] = c.checked || null; });
    ov.remove(); if (Object.keys(patch).length) act(() => DB.update(patch));
  };
}
// Aimee or the host draws the winner of an up-for-grabs date, with a little spin
async function grabDraw(day) {
  const ids = entriesFor(day); if (!ids.length || drawing) return;
  const win = shuffle(ids)[0];
  try { await DB.update({ ['grabbed/' + day]: { pid: win, paid: false, at: Date.now() }, ['grabs/' + day]: null }); }
  catch (e) { console.warn(e); return alert("That didn't save. Check the internet and try again."); }
  drawing = true;
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="box"><h2>🎟️ ${nice(day, true)}</h2><p class="muted">And the date goes to…</p><p class="spin" style="font-size:30px;font-weight:700;min-height:44px"></p><div class="btns"></div></div>`;
  document.body.append(ov);
  const s = ov.querySelector('.spin'), wait = ms => new Promise(r => setTimeout(r, ms)), names = ids.map(nameOf);
  for (let k = 0; k < (matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 16); k++) { s.textContent = names[k % names.length]; await wait(50 + k * 12); }
  s.textContent = '🎉 ' + nameOf(win); confetti(120);
  const btns = ov.querySelector('.btns'); btns.innerHTML = `<p class="muted" style="width:100%">${esc(nameOf(win))} pays ${amt()} straight away.</p><button data-go>OK</button>`;
  btns.querySelector('[data-go]').onclick = () => { ov.remove(); drawing = false; };
}
function ask(html, yes, fn) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="font-size:19px">${html}</p><div class="btns"><button class="ghost" data-no>Cancel</button><button data-yes>${yes}</button></div></div>`;
  document.body.append(ov);
  ov.querySelector('[data-no]').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector('[data-yes]').onclick = () => { ov.remove(); fn(); };
  ov.querySelector('[data-yes]').focus();
}

/* ---------- the draw: names spin like a slot machine and land one by one ---------- */
let drawing = false;
async function playDraw(force) {
  const ord = order(); if (!ord.length || drawing) return;
  const sig = list(S.order).join(',');
  if (!force && store.get('dd-seen-draw') === sig) return;
  drawing = true;
  const names = ord.map(nameOf);
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="box"><h2>🎲 The Draw!</h2><p class="muted">Aimee picks first. Everyone else, fingers crossed…</p>
    <ol class="slots">${names.map((_, i) => `<li><span class="n">${i + 1}</span><span class="s">❔</span></li>`).join('')}</ol>
    <div class="btns"><button class="ghost" data-skip>Skip</button></div></div>`;
  document.body.append(ov);
  let stop = false;
  const done = () => { stop = true; ov.remove(); drawing = false; store.set('dd-seen-draw', sig); };
  ov.querySelector('[data-skip]').onclick = done;
  const rows = [...ov.querySelectorAll('.slots li')], wait = ms => new Promise(r => setTimeout(r, ms));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let i = 0; i < rows.length && !stop; i++) {
    const li = rows[i], s = li.querySelector('.s'); li.classList.add('on');
    li.scrollIntoView({ block: 'nearest' });
    const spins = reduce ? 0 : i === 0 ? 6 : 12;
    for (let k = 0; k < spins && !stop; k++) { s.textContent = names[Math.floor(Math.random() * names.length)]; await wait(45 + k * 9); }
    s.textContent = (i === 0 ? '👑 ' : '') + names[i]; li.classList.add('landed');
    await wait(reduce ? 120 : 380);
  }
  if (stop) return;
  confetti(160);
  const btns = ov.querySelector('.btns'); btns.innerHTML = '<button data-go>Let\'s pick dates! 📅</button>';
  btns.querySelector('[data-go]').onclick = done;
}

/* ---------- confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d'); let bits = [], running = false;
function confetti(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ['#ff6f91', '#ffe98a', '#8fe3c5', '#9fd8ff', '#c9b6ff', '#ff9a8b'];
  for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .3, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, s: (6 + Math.random() * 6) * devicePixelRatio, c: cols[i % cols.length] });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(b => b.y < cv.height + 30);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy * devicePixelRatio; b.vy += .04; b.r += b.vr; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
  if (bits.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- owner tools (5 taps on the STE logo) ---------- */
window.STE = window.STE || {}; STE.ownerTabs = STE.ownerTabs || [];
STE.ownerTabs.push({ title: 'Due Date', render(el, api) {
  const draw = () => {
    const ps = Object.values(people()), dates = Object.keys(S.dates || {});
    el.innerHTML = `<p><b>${ps.length}</b> names · ${S.locked ? 'locked and drawn' : 'still joining'} · ${dates.length} dates picked${S.birth ? ' · baby born ' + S.birth : ''}</p>
      <p>Organiser: <b>${S.aimee && people()[S.aimee.pid] ? api.esc(nameOf(S.aimee.pid)) : 'nobody yet'}</b></p>
      <p><button data-o="aimee">Free up the "Aimee" name</button><br><small>Removes whoever is called Aimee, so the real Aimee can add her name and get the buttons.</small></p>
      <p><button data-o="unlock">Undo the draw</button><br><small>Unlocks the names and clears the order and every picked date.</small></p>
      <p><button data-o="wipe">Start a brand new pool</button><br><small>Deletes every name, date and setting.</small></p>`;
    el.querySelectorAll('[data-o]').forEach(b => b.onclick = async () => {
      const o = b.dataset.o, clearDates = Object.fromEntries(Object.keys(S.dates || {}).map(d => ['dates/' + d, null]));
      const clearSkips = Object.fromEntries(Object.keys(S.skipped || {}).map(id => ['skipped/' + id, null]));
      if (!confirm({ aimee: 'Remove the current "Aimee"?', unlock: 'Undo the draw and clear all picked dates?', wipe: 'Delete the whole pool? This cannot be undone.' }[o])) return;
      let patch = {};
      if (o === 'aimee') patch = { aimee: null, ...(S.aimee ? { ['people/' + S.aimee.pid]: null } : {}) };
      const clearGrabs = Object.fromEntries([...Object.keys(S.grabs || {}).map(d => ['grabs/' + d, null]), ...Object.keys(S.grabbed || {}).map(d => ['grabbed/' + d, null])]);
      if (o === 'unlock') patch = { locked: null, order: null, birth: null, ...clearDates, ...clearSkips, ...clearGrabs };
      if (o === 'wipe') patch = { locked: null, order: null, birth: null, due: null, aimee: null, amount: null, ...clearDates, ...clearSkips, ...clearGrabs,
        ...Object.fromEntries(Object.keys(S.paid || {}).map(id => ['paid/' + id, null])), ...Object.fromEntries(Object.keys(people()).map(id => ['people/' + id, null])) };
      try { await DB.update(patch); draw(); } catch (e) { alert('That did not save: ' + (e.message || e)); }
    });
  };
  draw();
} });
// Payments: the host ticks off each name (and each up-for-grabs date won) when the Revolut money arrives
STE.ownerTabs.push({ title: 'Payments', render(el, api) {
  const draw = () => {
    const ps = Object.keys(people()).filter(id => !isAimeeId(id)).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const paidN = ps.filter(id => isPaid(id)).length, by = payBy();
    el.innerHTML = `<p><b>${paidN}</b> of <b>${ps.length}</b> names paid · ${S.amount ? euro(S.amount) + ' each' : 'Aimee hasn\'t set the amount yet'}</p>
      <p><small>${by ? `Deadline: end of ${nice(by, true)}${pastDeadline() ? ' (passed: unpaid names have lost their dates)' : ''}` : 'The deadline starts once someone picks a date.'}</small></p>
      ${ps.map(id => `<p><label><input type="checkbox" data-paid="${id}" ${isPaid(id) ? 'checked' : ''}> ${api.esc(nameOf(id))}</label>${forfeit(id) ? ' <small>❌ forfeit</small>' : ''}</p>`).join('') || '<p><small>Nobody has joined yet.</small></p>'}
      ${wonDays().length ? '<h3>Up-for-grabs dates won</h3>' + wonDays().map(d => `<p><label><input type="checkbox" data-gpaid="${d}" ${S.grabbed[d].paid ? 'checked' : ''}> ${nice(d)}: ${api.esc(nameOf(grabbedBy(d)))}</label> <button data-redraw="${d}">Undo this win</button></p>`).join('') : ''}
      ${grabDays().map(d => `<p>🎟️ ${nice(d)}: ${entriesFor(d).length} entries <button data-gd="${d}" ${entriesFor(d).length ? '' : 'disabled'}>Draw the winner</button></p>`).join('')}`;
    const save = async patch => { try { await DB.update(patch); draw(); } catch (e) { alert('That did not save: ' + (e.message || e)); } };
    el.querySelectorAll('[data-paid]').forEach(c => c.onchange = () => save({ ['paid/' + c.dataset.paid]: c.checked || null }));
    el.querySelectorAll('[data-gpaid]').forEach(c => c.onchange = () => save({ ['grabbed/' + c.dataset.gpaid + '/paid']: c.checked }));
    el.querySelectorAll('[data-redraw]').forEach(b => b.onclick = () => { if (confirm('Take this date back? It goes up for grabs again.')) save({ ['grabbed/' + b.dataset.redraw]: null }); });
    el.querySelectorAll('[data-gd]').forEach(b => b.onclick = async () => { await grabDraw(b.dataset.gd); draw(); });
  };
  draw();
} });

// the deadline passes at midnight: redraw the page when it does
let wasPast = null;
setInterval(() => { if (!started) return; const p = pastDeadline(); if (wasPast !== null && p !== wasPast) render(); wasPast = p; }, 60000);

/* ---------- start ---------- */
try {
  DB = MOCK ? mockDB() : await firebaseDB();
  DB.listen(v => {
    S = v; started = true;
    render();
    if (amAimee() && !S.amount && !askedAmount && !S.locked) askAmount();
    lastDates.pop = null;
    if (S.locked && order().length) playDraw(false);
    if (S.birth && store.get('dd-seen-birth') !== S.birth) { store.set('dd-seen-birth', S.birth); confetti(220); }
  });
} catch (e) { console.warn(e); showError(); }

if ('serviceWorker' in navigator && !LOCAL) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
